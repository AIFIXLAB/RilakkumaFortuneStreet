<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rilakkuma Fortune Street</title>
<link rel="icon" href="assets/cardback.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
:root{--brown:#6b4226;--brown2:#8a5a35;--cream:#fff7e6;--cream2:#ffeccc;--pink:#ff8fb1;--yellow:#ffd25e;--green:#7fcf7a;--blue:#7cc0ff;--purple:#b99cf0;--red:#ff6b6b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#f3d9b8;font-family:"Mali","Itim",-apple-system,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;color:var(--brown);touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#ffe9f1,#f6d7b2)}
#stage{position:relative;flex:none;width:1280px;height:860px;transform-origin:center center;overflow:hidden;background:#fff3df;border-radius:18px;box-shadow:0 10px 40px rgba(107,66,38,.25)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.spr{display:inline-block;background-repeat:no-repeat;flex:none;vertical-align:middle}
button,.btn{position:relative;font-family:inherit;cursor:pointer;border:3px solid var(--brown);border-radius:18px;background:linear-gradient(#fff6d6,#ffd97a);color:var(--brown);font-weight:800;font-size:18px;padding:10px 18px;box-shadow:0 4px 0 var(--brown);min-height:48px;transition:transform .08s}
button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
button:disabled{filter:grayscale(1);opacity:.5;pointer-events:none}
button.pink{background:linear-gradient(#ffe1ec,#ff9fbe)} button.green{background:linear-gradient(#e8ffd9,#8fdc7c)} button.blue{background:linear-gradient(#e3f3ff,#8ecbff)} button.gray{background:linear-gradient(#f3f3f3,#cfcfcf)} button.purple{background:linear-gradient(#f0e6ff,#c4a8f5)}
button.small{font-size:15px;padding:6px 12px;min-height:38px;border-radius:14px;border-width:2px;box-shadow:0 3px 0 var(--brown)}
.panel{background:var(--cream);border:4px solid var(--brown);border-radius:22px;box-shadow:0 6px 0 rgba(107,66,38,.35)}
.title{font-weight:900;font-size:26px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--brown);border-radius:999px;padding:3px 10px;font-weight:800;font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
.muted{opacity:.7}
.coin::before{content:'';display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7a8,#f4b400);border:2px solid #b07800;margin-right:4px;vertical-align:-3px}
/* ---------- MENU ---------- */
#menu{background:#bfe6ff}
#menuBgBlur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.1);opacity:.9}
#menuImg{position:absolute;left:0;top:0;width:1280px;height:721px;background-size:100% 100%}
.hot{position:absolute;cursor:pointer;border-radius:30px}
.hot:active{background:rgba(255,255,255,.25)}
.hudnum{position:absolute;background:#6e4a2c;color:#fff;font-weight:900;font-size:21px;display:flex;align-items:center;justify-content:center;border-radius:10px;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#menuBar{position:absolute;left:0;right:0;top:721px;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#fff3df,#ffe2bd);border-top:4px solid var(--brown)}
#menuBar button{font-size:17px}
.badge{position:absolute;min-width:24px;height:24px;border-radius:12px;background:#ff4d6d;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;pointer-events:none}
/* ---------- SETUP / LOADOUT ---------- */
.scrhead{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(#ffd6e4,#ffb7cf);border-bottom:4px solid var(--brown)}
.scrhead .title{flex:1;text-align:left;font-size:30px}
.scrbody{position:absolute;left:0;right:0;top:76px;bottom:0;padding:16px 20px;overflow:auto}
.mapcard{width:290px;border:4px solid var(--brown);border-radius:20px;background:#fff;overflow:hidden;cursor:pointer;position:relative}
.mapcard.sel{outline:6px solid #ff7aa8;transform:translateY(-3px)}
.mapcard .thumb{height:170px;background-size:cover;background-position:center}
.mapcard .nm{padding:8px 12px;font-weight:900;font-size:18px}
.slot{border:3px solid var(--brown);border-radius:18px;background:#fff;padding:10px;width:290px}
.seg{display:flex;border:2px solid var(--brown);border-radius:14px;overflow:hidden}
.seg div{flex:1;text-align:center;padding:8px 4px;font-weight:800;cursor:pointer;background:#fff;font-size:15px}
.seg div.on{background:var(--yellow)}
.charpick{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.charbtn{border:3px solid var(--brown);border-radius:14px;background:#fff;height:96px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.charbtn.sel{background:#ffe48a;outline:4px solid #ff7aa8}
.charbtn.lock{filter:grayscale(1);opacity:.45}
.charbtn .who{position:absolute;bottom:2px;right:4px;font-size:12px;font-weight:900}
.eqslot{width:150px;height:150px;border:4px dashed var(--brown2);border-radius:20px;background:#fffaf0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;font-weight:800;font-size:13px;gap:4px;position:relative}
.eqslot.filled{border-style:solid;background:#fff}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.invitem{border:3px solid var(--brown);border-radius:16px;background:#fff;padding:6px;text-align:center;cursor:pointer;position:relative;font-size:13px;font-weight:800;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.invitem .q{position:absolute;top:4px;right:6px;background:var(--brown);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
.invitem.dim{opacity:.4}
.invitem.eqd{background:#e9ffe0;outline:3px solid #6fc35d}
/* ---------- GAME ---------- */
#game{background:#fff3df}
#pbar{position:absolute;left:8px;right:8px;top:8px;height:92px;display:flex;gap:8px}
.pcard{flex:1;position:relative;border:4px solid var(--brown);border-radius:18px;background:#fff;display:flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;overflow:hidden}
.pcard.turn{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pc);animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 4px #fff,0 0 0 10px var(--pc)}}
.pcard.bk{filter:grayscale(1);opacity:.55}
.pcard .stripe{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--pc)}
.pcard .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.pcard .cash{font-weight:900;font-size:19px}
.pcard .nw{font-size:13px;font-weight:700;opacity:.8}
.suits{display:flex;gap:2px}
.suits span{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#eee;color:#bbb;border:1.5px solid #ccc}
.suits span.on{background:#fff;border-color:currentColor}
.rankb{position:absolute;top:2px;right:6px;font-weight:900;font-size:13px;background:var(--yellow);border:2px solid var(--brown);border-radius:10px;padding:0 6px}
#boardWrap{position:absolute;left:8px;top:108px;width:930px;height:744px;border:4px solid var(--brown);border-radius:22px;overflow:hidden}
#boardBg{position:absolute;inset:-30px;background-size:cover;background-position:center;opacity:.55;filter:blur(14px) saturate(1.1)}
#boardWrap{touch-action:none}
#board{transform-origin:0 0;will-change:transform;-webkit-transform-style:flat;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.ptile{position:absolute;z-index:3;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ptile.owned{z-index:5}
.ptile .bld{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.ptile .ico{background:rgba(255,255,255,.88);border-radius:22%;padding:2px;display:flex;box-shadow:0 1px 0 rgba(107,66,38,.3)}
.ptile .forsale{opacity:.5;display:flex}
.ptile .lbl{position:absolute;bottom:-6%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--brown);border-radius:8px;font-weight:900;padding:0 4px;white-space:nowrap;z-index:2}
.ptile .own{position:absolute;top:-22%;right:-22%;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#fff;z-index:4;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px var(--brown)}
.ptile .lv{position:absolute;top:-16%;left:-16%;background:var(--brown);color:#fff;font-weight:900;border-radius:7px;padding:0 4px;z-index:4}
.ptile.hl{animation:pulse .6s infinite alternate;z-index:6;box-shadow:0 0 0 5px #ff5d8f}
.lot{position:absolute;z-index:2;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:2px;pointer-events:none}
.lotb{border-bottom:5px solid;border-radius:6px}
.zbtns{position:absolute;right:10px;bottom:10px;z-index:40;display:flex;gap:6px;align-items:center}
.zbtns div{width:50px;height:50px;border-radius:14px;background:#fff7e6;border:3px solid var(--brown);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--brown)}
.zbtns div.on{background:#ffd25e}
.zbtns span{background:#fff;border:2px solid var(--brown);border-radius:10px;padding:2px 6px;font-weight:900;font-size:13px}
.cgrid .gi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.95}
.cgrid div.used{opacity:1;pointer-events:none}
#board{position:absolute}
.road{position:absolute;background:#f6e3c3;border:2px solid #d9b98d;border-radius:6px;z-index:1}
.halo{position:absolute;border-radius:16px;z-index:2;opacity:.5}
.tile{position:absolute;z-index:3;border-radius:12px;border:3px solid var(--brown);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:visible;box-shadow:0 3px 0 rgba(107,66,38,.35)}
.tile.shop{border-width:5px}
.tile .lbl{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--brown);border-radius:9px;font-size:11.5px;font-weight:900;padding:0 5px;white-space:nowrap;z-index:2;line-height:16px}
.tile .own{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--brown);overflow:hidden;background:#fff;z-index:4;display:flex;align-items:center;justify-content:center}
.tile .lv{position:absolute;top:-8px;left:-8px;background:var(--brown);color:#fff;font-size:11px;font-weight:900;border-radius:8px;padding:0 5px;z-index:4}
.tile .glyph{font-size:34px;font-weight:900;line-height:1}
.dlabel{position:absolute;z-index:4;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.92);border:3px solid;border-radius:12px;font-size:11px;font-weight:900;padding:1px 8px;display:flex;align-items:center;gap:5px;pointer-events:none;box-shadow:0 2px 0 rgba(107,66,38,.25)}
.dlabel span{width:12px;height:12px;border-radius:4px;border:2px solid #6b4226}
.tile.hl{animation:pulse .6s infinite alternate;z-index:6}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 0 6px #ff5d8f}}
.tile .forsale{position:absolute;inset:3px;display:flex;align-items:center;justify-content:center;opacity:.35}
.dirArrow{position:absolute;z-index:30;width:64px;height:64px;border-radius:50%;background:#ff5d8f;border:4px solid #fff;box-shadow:0 0 0 3px var(--brown),0 6px 10px rgba(0,0,0,.3);color:#fff;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:bob .5s infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.piece{position:absolute;z-index:20;transition:left .2s ease,top .2s ease;pointer-events:none;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.piece.hop .spr{animation:hop .2s}
@keyframes hop{50%{transform:translateY(-14px)}}
.piece .ring{position:absolute;left:50%;bottom:-4px;width:70%;height:12px;transform:translateX(-50%);border-radius:50%;background:var(--pc);opacity:.75;z-index:-1}
#side{position:absolute;left:946px;top:108px;width:326px;height:744px;display:flex;flex-direction:column;gap:8px}
#roundBox{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:900}
#actBox{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:170px}
#actBox .msg{font-weight:900;font-size:17px;text-align:center}

#itemBar{display:flex;gap:8px;justify-content:center;padding:6px}
.itemSlot{width:92px;height:92px;border:3px solid var(--brown);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.itemSlot.used{filter:grayscale(1);opacity:.55}
.itemSlot.used::after{content:'USED';position:absolute;transform:rotate(-18deg);font-weight:900;color:#d33;border:3px solid #d33;border-radius:8px;padding:0 6px;background:rgba(255,255,255,.8);font-size:15px}
.itemSlot.ready{box-shadow:0 0 0 4px #7fcf7a}
.itemSlot .k{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:var(--brown);color:#fff;border-radius:8px;padding:0 5px;white-space:nowrap}
#stockBox{padding:6px 8px}
.srow{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;padding:3px 2px;border-bottom:1px dashed #e0c8a8;cursor:pointer}
.srow .dot{width:14px;height:14px;border-radius:4px;border:2px solid var(--brown)}
#logBox{flex:1;overflow:auto;padding:6px 10px;font-size:12.5px;line-height:1.45}
#logBox div{border-bottom:1px dotted #e7d2b5;padding:2px 0}
#logBox .gain{color:#2c8a2c} #logBox .lose,#logBox .bad{color:#c0392b} #logBox .rent{color:#a0522d} #logBox .card{color:#7a4fb5} #logBox .win{color:#d4a000;font-weight:900}
#diceLayer{position:absolute;left:8px;top:108px;width:930px;height:744px;display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none}
#diceLayer.on{display:flex}
#diceLayer .num{position:absolute;font-size:110px;font-weight:900;color:#fff;-webkit-text-stroke:5px var(--brown);margin-top:250px}
.float{position:absolute;z-index:200;font-weight:900;font-size:24px;pointer-events:none;animation:floatUp 1.4s forwards;-webkit-text-stroke:1px #fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
@keyframes floatUp{to{transform:translateY(-60px);opacity:0}}
/* ---------- MODAL ---------- */
#modal{position:absolute;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(80,45,20,.35)}
#modal.on{display:flex}
#modalBox{min-width:420px;max-width:1100px;max-height:820px;overflow:auto;padding:18px 22px;position:relative;animation:pop .18s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#modalBox .mtitle{font-size:25px;font-weight:900;text-align:center;margin-bottom:10px}
#modalBox .mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.xbtn{position:absolute;top:8px;right:10px;width:44px;height:44px;border-radius:50%;background:#ff7a7a;border:3px solid var(--brown);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 var(--brown)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:16px;font-weight:700}
.kv b{font-weight:900;text-align:right}
.opt{display:flex;align-items:center;gap:10px;border:3px solid var(--brown);border-radius:16px;background:#fff;padding:8px 12px;cursor:pointer;font-weight:800;min-height:56px}
.opt:active{background:#fff2bd}
.opt .sw{width:18px;height:18px;border-radius:5px;border:2px solid var(--brown);flex:none}
.cardFace{width:300px;border-radius:22px;border:6px solid var(--brown);background:#fff;overflow:hidden;text-align:center;margin:0 auto}
.cardFace .cat{font-weight:900;color:#fff;padding:6px;font-size:15px}
.cardFace .art{height:220px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fffbe8,#ffe7b8)}
.cardFace .nm{font-size:24px;font-weight:900;padding:6px 8px 0}
.cardFace .ds{font-size:16px;font-weight:700;padding:4px 14px 12px}
.cardFace .id{font-size:12px;opacity:.6;padding-bottom:6px}
.cgrid{display:grid;grid-template-columns:repeat(10,58px);gap:5px;padding:10px;border-radius:18px;background:#fbe9c8;border:4px solid #e2a92e}
.cgrid div{width:58px;height:48px;background:url(assets/cardback.png) center/100% 100%;cursor:pointer;border-radius:8px;position:relative}
.cgrid div.used{background-image:none!important}
.cgrid div.pick{animation:pulse .3s infinite alternate}
.cgrid .rh{position:absolute;font-size:10px;font-weight:900;color:#6b4226}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);z-index:700;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#fffbe9;border:3px solid var(--brown);border-radius:16px;padding:8px 16px;font-weight:900;font-size:17px;box-shadow:0 4px 0 rgba(107,66,38,.3);animation:pop .2s}
.reel{width:150px;height:150px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;color:#d22}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:3px solid var(--brown);border-radius:14px;background:#fff;padding:8px 12px;font-weight:900;cursor:pointer;font-size:15px}
.tab.on{background:var(--yellow)}
.shopgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sitem{border:4px solid var(--brown);border-radius:18px;background:#fff;padding:8px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:230px}
.sitem .nm{font-weight:900;font-size:15px}
.sitem .ds{font-size:12px;font-weight:700;opacity:.8;min-height:32px}
.sitem .tag{position:absolute;top:-8px;left:-6px;background:#ff4d6d;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:900;border:2px solid #fff}
.sitem .own{position:absolute;top:6px;right:8px;font-size:12px;font-weight:900;background:#6fc35d;color:#fff;border-radius:10px;padding:0 6px}
.town{position:relative;width:960px;height:520px;border:5px solid var(--brown);border-radius:24px;background:linear-gradient(#bfe8ff 0 22%,#9fdc8a 22%);overflow:hidden}
.tcell{position:absolute;width:120px;height:120px;border:2px dashed rgba(107,66,38,.18);display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.tcell.sel{background:rgba(255,255,255,.4);border-color:#ff5d8f}
.spark{display:block}

/* ===== v0.3 cute game HUD ===== */
#pbar{height:104px}
.pcard{border:4px solid var(--pc);border-radius:22px;background:linear-gradient(135deg,#fff 10%,var(--pcl) 100%);padding:4px 12px 4px 4px;gap:4px;box-shadow:0 4px 0 rgba(107,66,38,.25)}
.pcard .stripe{display:none}
.pcard .pno{background:var(--pc);color:#fff;font-weight:900;border-radius:10px;padding:0 8px;font-size:15px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--brown);flex:none}
.pcard .crown{position:absolute;left:10px;top:-4px;font-size:24px;z-index:3;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.pcard .nm{font-size:16px;max-width:140px}
.pcard .cash{font-size:22px}
.pcard .nwpill{display:inline-block;white-space:nowrap;background:rgba(255,255,255,.9);border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:900;border:1.5px solid rgba(107,66,38,.25)}
.pcard .rankb{font-size:15px;padding:1px 8px;top:4px;right:8px;border-radius:12px}
.pcard .aitag{font-size:10px;background:rgba(255,255,255,.8);border-radius:6px;padding:0 4px;margin-left:2px}
.pcard .suits span{width:16px;height:16px;font-size:11px}
.pcard .suits{flex:none}
#boardWrap{top:120px;width:870px;height:732px;background:#e9f5ff radial-gradient(circle,#cfe6ff 22%,transparent 24%) 0 0/26px 26px;touch-action:none}
#boardBg{display:none}
#diceLayer{top:120px;width:870px;height:732px}
#side{left:886px;top:120px;width:386px;height:732px;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--brown);border-radius:999px;padding:3px 12px 3px 4px;font-weight:900;font-size:17px;height:54px;box-shadow:0 3px 0 rgba(107,66,38,.3);white-space:nowrap}

/* online */
.roomcode{font-size:64px;font-weight:700;letter-spacing:10px;text-align:center;color:#ff5d8f;-webkit-text-stroke:3px #fff;paint-order:stroke fill;background:#fff3f8;border:4px dashed #ff8fb3;border-radius:22px;padding:4px 20px}
.codein{font-size:44px;font-weight:700;letter-spacing:12px;text-align:center;width:300px;border:4px solid var(--brown);border-radius:18px;font-family:inherit;text-transform:uppercase}
.lobbyP{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lobbyP>div{border:4px solid;border-radius:18px;background:#fff;text-align:center;padding:6px;font-weight:700;min-height:150px}
.netbadge{position:absolute;left:12px;top:10px;z-index:40;background:#fff;border:3px solid var(--brown);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px}
#netOverlay{position:absolute;inset:0;z-index:800;background:rgba(255,220,235,.6);display:flex;align-items:center;justify-content:center;pointer-events:all}
#netOverlay>div{background:#fff;border:5px solid var(--brown);border-radius:28px;padding:24px 40px;font-size:26px;font-weight:700;text-align:center;animation:bob .8s infinite alternate}
.ptile.pad{background:radial-gradient(circle at 50% 40%,#fffbe9,#f3dcae);border:4px solid #c9a46a;box-shadow:0 3px 0 rgba(107,66,38,.35)}
.ico.glyph{width:70%;height:70%;align-items:center;justify-content:center;font-weight:700}
.buffrow{position:absolute;right:6px;top:30px;z-index:4;display:flex;gap:2px;flex-wrap:wrap;background:#fff;border:2px solid #ffb3cc;border-radius:10px;padding:0 4px;align-self:flex-start;font-size:15px;cursor:pointer;margin-top:2px;max-width:120px}
.bufbtn{width:72px;height:100px;border:3px solid #ff8fb3;border-radius:14px;background:linear-gradient(#fff,#ffeef4);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;text-align:center;flex:none}
.bufbtn>div:first-child{font-size:24px}.bufbtn .bfl{font-size:13px;line-height:1.1;word-break:break-all}
.buffitem{display:flex;gap:10px;align-items:center;border:3px solid #ffb3cc;border-radius:14px;padding:6px 10px;background:#fff}
.buffitem .bi{font-size:28px}
.skillban{background:#fff3c4;border:3px solid #ffb300;border-radius:14px;padding:6px 12px;font-weight:700;text-align:center;margin-bottom:8px}
#mapCards{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start!important;padding:6px 8px 12px;scroll-snap-type:x proximity}
#mapCards .mapcard{flex:0 0 170px;scroll-snap-align:start}
#mapCards::-webkit-scrollbar{height:12px}#mapCards::-webkit-scrollbar-thumb{background:#e0a96d;border-radius:8px;border:2px solid #6b4226}
.mapcard{width:170px}.mapcard .thumb{height:96px;background-size:contain;background-repeat:no-repeat;background-color:#eaf6ff}.mapcard .nm{font-size:14px;padding:4px 8px}
#itemBar{width:410px!important}
#actBox{width:560px!important}#actMain{width:210px!important}
.sphgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sphopt{border:4px solid var(--brown);border-radius:20px;background:linear-gradient(#fff,#f5ecff);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(107,66,38,.25)}
.sphopt b{font-size:17px}.sphopt span{font-size:12px;font-weight:600;min-height:64px}
.sphopt:active{transform:scale(.96)}.sphopt.dimo{filter:grayscale(.8);opacity:.5}
.ico.splot{background:rgba(255,255,255,.9);gap:0;display:flex;align-items:flex-end;padding:2px 3px}
/* effect dice skins */
.cube.still{transform:rotateX(-24deg) rotateY(-36deg)}
.cdiceIcon{display:flex;align-items:center;justify-content:center;position:relative}
.cdiceIcon .dicewrap{perspective:500px}
.cube .fc.sk{background-image:none;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.12)}
.cube .fc.sk::after{display:none}
.cube .fc.sk i{position:absolute;transform:translate(-50%,-50%);font-style:normal;line-height:1;font-weight:900}
.dfx .daura{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;pointer-events:none;opacity:.75;animation:aura 1.4s ease-in-out infinite}
@keyframes aura{50%{transform:translateX(-50%) scale(1.12);opacity:1}}
.dpart{position:absolute;pointer-events:none;transform:translate(-50%,-50%);animation:dpart 1.2s ease-out forwards;z-index:3}
@keyframes dpart{0%{opacity:0;transform:translate(calc(-50% + var(--x0)),calc(-50% + var(--y0))) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x1)),calc(-50% + var(--y1))) scale(1.1) rotate(160deg)}}
.dicewrap.dflash .daura{animation:dflash .6s ease-out,aura 1.4s ease-in-out .6s infinite}
@keyframes dflash{0%{transform:translateX(-50%) scale(.6);opacity:1}40%{transform:translateX(-50%) scale(1.6);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:.75}}
/* heart */
.dfx-heart .fc.sk{background:radial-gradient(circle at 30% 25%,#fff0f6 0,#ffc2d9 35%,#ff8fb8 100%)}
.dfx-heart .in{background:#ff9fc2}
.dfx-heart .fc.sk i{color:#ff2f7d;text-shadow:0 0 6px #fff,0 2px 0 #fff}
.dfx-heart .daura{background:radial-gradient(circle,rgba(255,120,170,.55) 0,rgba(255,120,170,0) 65%)}
/* sakura */
.dfx-sakura .fc.sk{background:radial-gradient(circle at 30% 25%,#fff 0,#fff3f8 40%,#ffd3e4 100%)}
.dfx-sakura .in{background:#ffe0ec}
.dfx-sakura .daura{background:radial-gradient(circle,rgba(255,182,210,.5) 0,rgba(255,182,210,0) 65%)}
/* crystal */
.dfx-crystal .fc.sk{background:linear-gradient(135deg,#fdfeff 0,#c9edff 35%,#86ccff 70%,#e9f9ff 100%);box-shadow:inset 0 0 14px rgba(255,255,255,.9),0 0 10px rgba(110,200,255,.8)}
.dfx-crystal .in{background:#bfe8ff}
.dfx-crystal .fc.sk i{color:#2f8fe0;text-shadow:0 0 8px #fff,0 0 12px #7fd0ff}
.dfx-crystal .daura{background:radial-gradient(circle,rgba(120,210,255,.6) 0,rgba(120,210,255,0) 65%)}
.dfx-crystal .dpart{color:#7fd0ff;text-shadow:0 0 6px #fff}
/* galaxy */
.dfx-galaxy .fc.sk{background:radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 80% 75%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 35% 80%,#fff 50%,transparent 51%),radial-gradient(circle at 30% 30%,#7b4fd6 0,#3a1f7a 45%,#120a33 100%)}
.dfx-galaxy .in{background:#1d1048}
.dfx-galaxy .fc.sk i{color:#ffd54f;text-shadow:0 0 6px #ffd54f,0 0 14px #ffb300}
.dfx-galaxy .daura{background:radial-gradient(circle,rgba(150,110,255,.6) 0,rgba(150,110,255,0) 65%)}
.dfx-galaxy .dpart{color:#ffe082;text-shadow:0 0 6px #fff}
/* rainbow */
.dfx-rainbow .fc.sk{background:linear-gradient(135deg,#ff6b6b,#ffb347,#ffe66d,#7ee081,#5ec8ff,#a78bfa,#ff7ab6,#ff6b6b);background-size:400% 400%;animation:rbflow 2.4s linear infinite;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 0 12px rgba(255,255,255,.9)}
@keyframes rbflow{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.dfx-rainbow .in{background:#ffd1f0}
.dfx-rainbow .fc.sk i{color:#fff;text-shadow:0 0 6px #fff,0 0 12px #ff7ab6,0 0 18px #5ec8ff}
.dfx-rainbow .daura{background:conic-gradient(from 0deg,rgba(255,107,107,.55),rgba(255,230,109,.55),rgba(126,224,129,.55),rgba(94,200,255,.55),rgba(167,139,250,.55),rgba(255,107,107,.55));filter:blur(14px);animation:rbspin 2s linear infinite}
@keyframes rbspin{to{transform:translateX(-50%) rotate(360deg)}}
/* royal gold */
.dfx-royal .fc.sk{background:linear-gradient(115deg,#b8860b 0,#ffd54f 30%,#fff6c2 45%,#ffd54f 55%,#c99700 100%);background-size:250% 100%;animation:goldsh 1.8s linear infinite;box-shadow:inset 0 0 0 3px #fff3b0,inset 0 -6px 10px rgba(120,70,0,.3)}
@keyframes goldsh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.dfx-royal .in{background:#e0a800}
.dfx-royal .fc.sk i{color:#c0392b;text-shadow:0 1px 0 #fff3b0,0 0 6px #fff}
.dfx-royal .daura{background:radial-gradient(circle,rgba(255,213,79,.7) 0,rgba(255,213,79,0) 65%)}
/* character skills */
.charpick{max-height:290px;overflow:auto;padding:4px}
.charbtn.goldc{background:linear-gradient(#fff6c2,#ffd54f);border-color:#c78a00}
.skillchip{display:block;background:#fff6d8;border:2px dashed #e0a43a;border-radius:12px;padding:5px 9px;margin-top:5px;font-size:12px;font-weight:700;text-align:left;line-height:1.35;max-width:300px}
.skillchip b{display:block;color:#b5651d;font-size:14px}
.skillchip.gold{background:linear-gradient(#fff8d0,#ffe082);border:2px solid #d4a000}
.skillchip.big{font-size:13px;margin:6px auto 0}
.pskill{position:absolute;right:-2px;bottom:4px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #e0a43a;font-size:13px;display:flex;align-items:center;justify-content:center}
.pskill.gold{background:#ffd54f}
.windlost{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.windlost span{background:#eef6ff;border:2px solid #9cc8f0;border-radius:999px;padding:2px 10px;font-size:15px;animation:windfly 1.2s ease-in both}
.windlost span:nth-child(2n){animation-delay:.15s}.windlost span:nth-child(3n){animation-delay:.3s}
@keyframes windfly{0%{transform:translateX(0) rotate(0);opacity:1}60%{opacity:1}100%{transform:translateX(160px) translateY(-30px) rotate(25deg);opacity:.25}}
.teamchip{display:inline-block;color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:1px 9px;margin-bottom:2px;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.tcdot{display:inline-block;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #6b4226;cursor:pointer;margin:0 2px}
.tcdot.on{box-shadow:0 0 0 3px #6b4226,0 0 0 6px #ffd54f;transform:scale(1.1)}
.tcdot.off{opacity:.25;cursor:not-allowed}
.teamsum{display:inline-block;color:#fff;font-weight:900;font-size:11px;border-radius:999px;padding:1px 8px;margin-top:2px;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.tbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));pointer-events:none}
.wheelwrap{position:relative;width:280px;height:280px;margin:0 auto}
.wheel{width:280px;height:280px;border-radius:50%;border:6px solid #6b4226;box-shadow:0 4px 0 rgba(0,0,0,.2);position:relative}
.wheelptr{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:34px;color:#d0342c;z-index:2;text-shadow:0 2px 0 #fff}
.wlab{position:absolute;left:50%;top:50%;width:80px;margin:-10px 0 0 -40px;text-align:center;font-weight:900;font-size:13px;color:#4a2c17}
.storyP{display:block;margin:0 auto;height:540px;aspect-ratio:557/448;border-radius:14px;border:4px solid #6b4226}
#tour{background:linear-gradient(#fff4d6,#ffe2ee)}
.twrow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px}
.twcard{width:178px;border:4px solid #6b4226;border-radius:16px;background:#fff;overflow:hidden;text-align:center;position:relative}
.twcard .twimg{height:96px;background-size:cover;background-position:center}
.twcard .twnm{font-size:13px;font-weight:700;padding:4px}
.twcard .twst{font-weight:900;font-size:13px;padding-bottom:6px}
.twcard.lock{filter:grayscale(.85);opacity:.7}
.twcard.cur{box-shadow:0 0 0 4px #ffd54f,0 0 18px #ffb300;transform:scale(1.06)}
.twcard.done .twst{color:#2c8a2c}
.twarrow{font-size:22px;color:#b5651d;font-weight:900}
.twriv{display:flex;gap:6px;align-items:center;background:#fff8ec;border:2px solid #e5cfae;border-radius:14px;padding:4px 10px;font-weight:800;font-size:14px}
.twriv.me{border-color:#ff5d8f;background:#fff0f6}
.ttable{width:100%;border-collapse:collapse;font-weight:700;font-size:15px;text-align:center}
.ttable th{background:#ffe3b0;padding:6px;border-bottom:3px solid #6b4226}
.ttable td{padding:4px 6px;border-bottom:2px dashed #e5cfae}
.ttable tr.out td{opacity:.65}
.tpass{color:#2c8a2c;font-weight:900}.tout{color:#d0342c;font-weight:900}
.tbanner{text-align:center;font-size:34px;font-weight:900;padding:8px;border-radius:18px;border:4px solid #6b4226}
.tbanner.pass{background:#d8f5d0;color:#2c7a2c}.tbanner.out{background:#ffe0e0;color:#c62828}.tbanner.champ{background:linear-gradient(#fff6a8,#ffc46b);color:#8a5a00}
.champbg{position:absolute;inset:0;background:url(assets/bg_champ.webp) center/cover}
.champbg canvas{position:absolute;inset:0;pointer-events:none}
.chpod{position:absolute;transform:translate(-50%,-100%);text-align:center;animation:vdrop .8s cubic-bezier(.2,1.4,.4,1) both}
.chbtn{position:absolute;left:50%;bottom:24px;transform:translateX(-50%)}
.stbar{position:sticky;bottom:-2px;z-index:3;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:10px;background:#fff6d8;border:3px solid #6b4226;border-radius:16px;box-shadow:0 -4px 12px rgba(107,66,38,.18)}
.iinfo{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 10px;background:#fff8ec;border:2px dashed #e0a96d;border-radius:14px;font-size:13px;font-weight:700;line-height:1.45;min-height:54px}
.pfstat{flex:1 1 120px;background:#fff8ec;border:2px solid #e5cfae;border-radius:16px;padding:8px;text-align:center;display:flex;flex-direction:column;font-weight:700}
.pfstat b{font-size:24px}.pfstat span{font-size:12px;color:#8a6a4a}
.pfeq{display:flex;flex-direction:column;align-items:center;background:#fff8ec;border:2px solid #e5cfae;border-radius:14px;padding:6px 10px;font-weight:800;font-size:13px}
.pfxp{height:14px;border:2px solid #6b4226;border-radius:10px;background:#fff;overflow:hidden;margin:4px 20px}.pfxp i{display:block;height:100%;background:linear-gradient(90deg,#ffb3cf,#ff5d8f)}
.ptile.pksel{z-index:9;box-shadow:0 0 0 5px #fff,0 0 0 10px #22c55e,0 0 26px 12px rgba(34,197,94,.75)!important;animation:pkpulse .45s infinite alternate}
.ptile.pksel::after{content:'⬇';position:absolute;top:-70%;left:50%;transform:translateX(-50%);font-size:34px;color:#16a34a;text-shadow:0 0 4px #fff}
@keyframes pkpulse{from{transform:scale(1)}to{transform:scale(1.18)}}
.ptile.cfx{z-index:8;animation:cfxblink .35s 9 alternate}
@keyframes cfxblink{from{box-shadow:0 0 0 4px #fff,0 0 0 9px #ffcc00,0 0 26px 14px rgba(255,204,0,.9);filter:brightness(1.35)}to{box-shadow:0 0 0 2px #fff,0 0 0 4px #ff8f00;filter:none}}
#pickPanel{position:absolute;left:8px;top:8px;width:262px;max-height:760px;z-index:60;background:#fffaf0;border:4px solid #6b4226;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:800}
#pickPanel .pkhead{font-size:17px;font-weight:900;text-align:center;color:#6b4226}
#pickPanel .pkhint{font-size:12px;text-align:center;color:#a0522d}
#pickPanel .pklist{overflow:auto;max-height:380px;display:flex;flex-direction:column;gap:5px}
#pickPanel .pkopt{display:flex;gap:8px;align-items:center;padding:6px 8px;border:2px solid #e5cfae;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}
#pickPanel .pkopt.on{border-color:#22c55e;background:#eaffea;box-shadow:0 0 0 3px #bbf7d0}
#pickPanel .sw{width:18px;height:18px;border-radius:5px;border:2px solid #6b4226;flex:none}
#pickPanel .pksel{background:#fff3c4;border-radius:12px;padding:6px;text-align:center;font-size:14px}
#easter{background:linear-gradient(#f3e8ff,#ffe2ee)}
.ebanner{position:relative;height:190px;border-radius:20px;overflow:hidden;border:4px solid #6b4226}
.ebanner img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.ebtag{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.9);border:3px solid #b07ce0;border-radius:14px;padding:4px 12px;font-weight:900;color:#7b3fbf}
.emission{margin:6px 0;padding:6px 10px;background:#fff3c4;border:2px dashed #e0a96d;border-radius:12px;font-weight:800}
.echars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.echar{position:relative;background:#f6efff;border:3px solid #d7c2f5;border-radius:14px;display:flex;justify-content:center;cursor:pointer;filter:grayscale(.7) brightness(.95)}
.echar.own{filter:none;border-color:#b07ce0;background:linear-gradient(#fff,#f3e5ff)}
.echar span{position:absolute;right:3px;bottom:1px;font-size:13px}
.erules p{margin:8px 0;font-weight:700;line-height:1.55}
.hot.eventbtn{left:24px!important;top:300px;width:250px;height:150px;border-radius:18px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 18px rgba(123,63,191,.45);animation:wob 2.4s infinite ease-in-out;cursor:pointer}
.hot.eventbtn img{width:100%;height:100%;object-fit:cover}
.hot.eventbtn span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(123,63,191,.92));color:#fff;font-weight:900;text-align:center;padding:14px 4px 6px;font-size:16px}
#eventPill{position:absolute;left:34px;bottom:8px;max-width:600px;overflow:hidden;text-overflow:ellipsis;z-index:30;background:rgba(255,255,255,.95);border:3px solid #b07ce0;border-radius:16px;padding:4px 14px;font-weight:900;font-size:13px;color:#6b3fa0;white-space:nowrap;pointer-events:none}
.bunny{position:absolute;z-index:26;transition:left .22s ease,top .22s ease;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.bunny img{width:100%;height:100%;object-fit:contain}
.bunny.hop img{animation:bhop .22s ease}

.bunny.pop{animation:bpop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes bpop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.bunny.bye{animation:bbye .9s ease forwards}
@keyframes bbye{to{transform:translateY(-120%) scale(.3);opacity:0}}
.bdice{position:absolute;left:50%;top:-30%;transform:translateX(-50%) scale(0);background:#fff;border:3px solid #b07ce0;border-radius:10px;padding:0 6px;font-weight:900;font-size:14px;white-space:nowrap;transition:transform .2s}
.bdice.on{transform:translateX(-50%) scale(1)}
.begg{position:absolute;z-index:15;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));animation:eggbob 1.6s infinite ease-in-out}
.begg.gold{filter:drop-shadow(0 0 6px #ffd54f)}
.begg.new{animation:eggdrop .5s cubic-bezier(.2,1.6,.4,1)}

.eggpill{display:inline-block;margin-left:4px;background:#f3e5ff;border:2px solid #b07ce0;border-radius:10px;padding:0 6px;font-size:12px;font-weight:900;color:#6b3fa0}
.eggpop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:80;display:flex;gap:10px;align-items:center;background:#fffaf0;border:4px solid #b07ce0;border-radius:20px;padding:10px 18px;font-weight:800;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:bpop .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.eggpop.gold{border-color:#ffb300;background:linear-gradient(#fffbe6,#ffe9a8)}
.skillchip.easter{background:linear-gradient(#fbf3ff,#f1e1ff);border-color:#b07ce0}
#trainev{background:linear-gradient(#fff3d6,#ffe0d0)}
.hot.eventbtn.trainbtn{top:470px!important;box-shadow:0 6px 18px rgba(198,40,40,.45)}
.hot.eventbtn.trainbtn span{background:linear-gradient(transparent,rgba(160,30,30,.92))}
.tvmap{height:230px;border-radius:16px;border:4px solid #6b4226;background-size:cover;background-position:center;position:relative;cursor:pointer}
.tvmap span{position:absolute;right:8px;bottom:8px;background:#fff;border-radius:10px;padding:2px 8px;font-weight:800;font-size:13px}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.rcard{background:linear-gradient(#fffbe6,#ffe9a8);border:3px solid #d4a000;border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:4px;cursor:pointer}
.rcard.own{background:linear-gradient(#fff,#e8ffe8);border-color:#43a047}
.rcard .rnm{font-size:11px;font-weight:800;text-align:center;min-height:28px}
.rcard .rown{font-size:12px;font-weight:900;color:#2e7d32}
.skillchip.royal{background:linear-gradient(#fff8d0,#ffd54f);border:2px solid #b8860b}
.piece .trainimg{display:none}
.piece.driving .trainimg{display:block;position:absolute;left:-110%;bottom:-10%;width:320%;max-width:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.piece.driving > .spr{opacity:0}.piece.driving .pin{z-index:3;position:relative}

@keyframes crashspin{30%{transform:translateY(-60%) rotate(200deg) scale(1.2)}100%{transform:none}}
#boardWrap.shake{animation:bshake .4s}
@keyframes bshake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.crashpop{border-color:#e53935!important;background:linear-gradient(#fff,#ffe5e5)!important}
#diceLayer .two{display:flex;gap:30px;justify-content:center}
.trainintro{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:85;display:flex;gap:16px;align-items:center;background:linear-gradient(#fff8e1,#ffe0b2);border:5px solid #c62828;border-radius:24px;padding:14px 26px;font-weight:800;font-size:18px;box-shadow:0 12px 34px rgba(0,0,0,.35);animation:bpop .5s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.trainintro img{height:130px}.trainintro b{font-size:28px;color:#c62828}
.tkpop{height:150px;animation:bpop .6s cubic-bezier(.2,1.6,.4,1)}
.sync .pin{width:110px;font-size:28px;text-align:center;letter-spacing:6px;border:3px solid #6b4226;border-radius:12px;font-family:inherit;font-weight:900}
.symsg{margin-top:8px;font-weight:800;font-size:14px;line-height:1.6;min-height:40px}
.btnlike{display:inline-flex;align-items:center;cursor:pointer;background:#fff3c4;border:3px solid #6b4226;border-radius:14px;padding:4px 12px;font-weight:800}
.ccode{font-size:44px;font-weight:900;color:#ff5d8f;letter-spacing:6px;text-align:center;background:#fff;border:3px dashed #ff8fb3;border-radius:16px;margin:6px 0}
/* dragon */
.dragonpot{font-weight:900;font-size:40px;color:#d48a00;text-shadow:0 2px 0 #fff,0 0 12px rgba(255,200,0,.6);margin:4px 0}
.ptile.dragon .lbl{background:#fff0f0;color:#c62828;font-weight:900}
.dragonhit{animation:dhit .8s ease-in-out 2}
.dragonroar{animation:droar .6s ease-in-out 3}
@keyframes dhit{0%,100%{transform:none;filter:none}30%{transform:translateX(-10px) rotate(-6deg);filter:brightness(2)}60%{transform:translateX(8px) rotate(4deg)}}
@keyframes droar{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* v1.5: tap your own piece to roll */
.piece.tapme{pointer-events:auto;cursor:pointer;z-index:40}
.piece.tapme .spr{animation:tapbob 1s ease-in-out infinite}
.piece.tapme::after{content:'แตะเพื่อทอย!';position:absolute;left:50%;top:-38px;transform:translateX(-50%);white-space:nowrap;background:#ff5d8f;color:#fff;font-weight:900;font-size:13px;padding:2px 9px;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2);animation:tapbob 1s ease-in-out infinite}
@keyframes tapbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.piece.tapme::after{animation:none}
#turnChar.tapme{cursor:pointer;border-radius:16px;animation:tcglow 1.1s ease-in-out infinite}
@keyframes tcglow{0%,100%{box-shadow:0 0 0 0 rgba(255,93,143,.0)}50%{box-shadow:0 0 0 6px rgba(255,93,143,.55)}}
.taproll{font-weight:900;font-size:20px;line-height:1.35;text-align:center;color:#6b4226;background:#fff3f7;border:3px dashed #ff7aa8;border-radius:18px;padding:8px 16px}
.taproll b{color:#ff5d8f}
/* mystery boxes */
.bxgrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.bxcell{width:184px;min-height:220px;border:4px solid #6b4226;border-radius:22px;background:linear-gradient(#fffaf0,#ffe9c4);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(107,66,38,.25);text-align:center;padding:8px}
.bxcell .bximg{width:160px;animation:bxidle 1.6s ease-in-out infinite;pointer-events:none}
.bxcell .bxtap{font-weight:900;color:#ff5d8f;font-size:15px}
.bxcell.shake .bximg{animation:bxshake .5s linear}
@keyframes bxidle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes bxshake{0%{transform:scale(1) rotate(0)}20%{transform:scale(1.08) rotate(-10deg)}40%{transform:scale(1.12) rotate(10deg)}60%{transform:scale(1.16) rotate(-12deg)}80%{transform:scale(1.25) rotate(12deg)}100%{transform:scale(1.6);opacity:0}}
.bxcell.open{cursor:default;animation:bxpop .45s cubic-bezier(.2,1.6,.4,1)}
.bxcell.open.big{background:linear-gradient(#fff6a8,#ffc46b);border-color:#d48a00}
.bxcell .bxburst{position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(255,255,255,.65) 0 10deg,transparent 10deg 20deg);animation:bxspin 6s linear infinite;z-index:0;opacity:.6}
.bxcell.open>*:not(.bxburst){position:relative;z-index:1}
.bxname{font-weight:900;font-size:16px;color:#6b4226;margin-top:4px}
.bxsub{font-weight:800;font-size:12px;color:#b5651d}
.bxtag{font-weight:900;font-size:12px;background:#ff5d8f;color:#fff;border-radius:999px;padding:1px 8px}
@keyframes bxpop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes bxspin{to{transform:rotate(360deg)}}
.giftbtn{display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:bxidle 1.6s ease-in-out infinite}
.giftbtn img{width:130px;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.giftbtn span{pointer-events:none;background:#ff5d8f;color:#fff;font-weight:900;font-size:15px;border-radius:999px;padding:1px 10px;border:2px solid #fff;margin-top:-10px}
/* map viewer */
.mapcard .thumb{position:relative}
.mzoom{position:absolute;right:6px;bottom:6px;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #6b4226;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 0 rgba(107,66,38,.3)}
.mzoom:hover{background:#ffe2ee}
.mview{position:relative;width:100%;height:540px;overflow:hidden;border:4px solid #6b4226;border-radius:18px;background:#eaf6ff;touch-action:none;cursor:grab;margin:0 auto}
#mvI{position:absolute;left:0;top:0;transform-origin:0 0;background-size:100% 100%}
.mvz{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.mvz button{width:46px;height:46px;font-size:22px;padding:0}
.hlwrap{position:relative;width:900px;height:506px;margin:0 auto;background-size:100% 100%;border-radius:16px;border:4px solid #6b4226;overflow:hidden}
.hlwrap.winfx{animation:hlwin .5s 4 alternate}@keyframes hlwin{to{box-shadow:0 0 40px 10px #ffd54f;filter:brightness(1.15)}}
.hlrule{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(40,10,40,.82);color:#ffe082;font-weight:900;padding:8px 16px;border-radius:14px;white-space:nowrap;font-size:16px;border:2px solid #ffd54f}
.hlchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hlchip{border-radius:50%;width:78px;height:78px;font-weight:900;font-size:15px;background:radial-gradient(circle,#fff 0 45%,#e53935 46% 60%,#fff 61% 66%,#e53935 67%);color:#5d2b0a;border:3px solid #fff;box-shadow:0 3px 0 #8d1b1b}
.hlchip.on{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 4px #ffd54f,0 6px 0 #8d1b1b}
.hlbtn{min-width:220px;font-size:26px;font-weight:900;padding:12px 18px;border-radius:24px;color:#fff;display:flex;flex-direction:column;align-items:center;border:4px solid #ffe082}
.hlbtn small{font-size:16px;opacity:.9}.hlbtn.hi{background:linear-gradient(#ff6f61,#c62828)}.hlbtn.lo{background:linear-gradient(#64b5f6,#1565c0)}
.hldome{position:absolute;left:50%;top:50%;transform:translate(-50%,-42%);width:400px;height:210px;border-radius:200px 200px 30px 30px;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.45),rgba(255,255,255,.12) 60%,rgba(255,255,255,.05));border:3px solid rgba(255,255,255,.7);display:flex;align-items:flex-end;justify-content:center;gap:18px;padding-bottom:26px;box-shadow:0 0 30px rgba(255,220,120,.6)}
.hldie{width:84px;height:84px;background:#fff;border-radius:16px;box-shadow:inset 0 -6px 0 #e0d6c8,0 6px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.hldie.spin{animation:hlspin .35s linear infinite}.hldie.land{animation:hlland .4s ease-out}
@keyframes hlspin{0%{transform:translateY(-30px) rotate(0)}25%{transform:translateY(-8px) rotate(90deg) scale(.9)}50%{transform:translateY(-40px) rotate(180deg)}75%{transform:translateY(-10px) rotate(270deg) scale(.92)}100%{transform:translateY(-30px) rotate(360deg)}}
@keyframes hlland{0%{transform:translateY(-30px) scale(1.2)}60%{transform:translateY(4px) scale(.95)}100%{transform:none}}
.pips{display:grid;grid-template-columns:repeat(3,18px);grid-template-rows:repeat(3,18px);gap:4px}.pips i{border-radius:50%}.pips i.on{background:#3e2723}.pips i.on.red{background:#e53935}
.hlres{text-align:center;font-weight:900;font-size:22px;margin-top:8px;line-height:1.6}.hlsum{padding:2px 12px;border-radius:12px;color:#fff}.hlsum.hi{background:#c62828}.hlsum.lo{background:#1565c0}
.ptile .bkico{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.hot.eventbtn.bkkbtn{top:130px!important;box-shadow:0 6px 18px rgba(255,160,0,.5)}
.hot.eventbtn.bkkbtn span{background:linear-gradient(transparent,rgba(200,90,0,.92))}
.bktiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.bktier{border:4px solid #e0c9a6;border-radius:16px;padding:6px;text-align:center;cursor:pointer;background:#fffaf0;display:flex;flex-direction:column;align-items:center;gap:2px}
.bktier img{height:92px}.bktier.on{border-color:var(--tc);box-shadow:0 0 0 3px #fff,0 0 16px var(--tc);transform:translateY(-3px)}
.bkt1{font-weight:900;font-size:19px;color:var(--tc)}.bkt2{font-weight:700;font-size:11px}
.bkodds{font-size:12px;font-weight:700;margin-top:6px;background:#fff6e0;border-radius:10px;padding:6px 8px;line-height:1.5}
.bkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px;max-height:420px;overflow:auto}
.rcard.bkc:not(.own){background:linear-gradient(#f4f4f4,#e0e0e0);border-color:#bdbdbd}.rcard.bkc.sel{box-shadow:0 0 0 3px #ff5d8f}
.bagfx.bag-blue .bxcell{box-shadow:0 0 18px rgba(30,136,229,.55)}.bagfx.bag-purple .bxcell{box-shadow:0 0 22px rgba(142,36,170,.6)}.bagfx.bag-red .bxcell{box-shadow:0 0 28px rgba(255,193,7,.85);animation:bagglow 1.2s infinite alternate}
@keyframes bagglow{to{box-shadow:0 0 40px rgba(255,80,0,.9)}}
.bagfx.bag-red .bxcell.open{background:radial-gradient(circle,#fff6c0,#ffd54f)}
.bkev{width:100%;border-radius:16px;border:4px solid #6b4226;display:block}
.bkevpop{display:flex;justify-content:center;animation:bkpop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes bkpop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.bagpop{animation:bkpop .6s cubic-bezier(.2,1.6,.4,1),wob 2s .6s infinite}
</style>
